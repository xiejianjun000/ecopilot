<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPilot — 几何 Mark 方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Inter","PingFang SC",sans-serif;background:#f5f5f0;color:#1d2129;padding:48px;}
  .page{max-width:800px;margin:0 auto}
  h1{font-size:28px;font-weight:600;letter-spacing:-0.5px;margin-bottom:8px;}
  .sub{font-size:13px;color:#535353;line-height:1.6;margin-bottom:48px;}
  .sub strong{color:#059669}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:48px;}
  .card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;}
  .card-visual{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff;padding:24px;}
  .card-visual svg{display:block;}
  .card-body{padding:20px 20px 24px;border-top:1px solid #e5e7eb;}
  .card-body .name{font-size:16px;font-weight:600;margin-bottom:4px;}
  .card-body .desc{font-size:12px;color:#909090;line-height:1.6;}

  .fav-strip{display:flex;gap:12px;justify-content:center;margin-top:12px;padding:12px;background:#fafafa;border-radius:8px;}
  .fav-item{text-align:center;}
  .fav-item .dim{font-size:9px;color:#b0b4ba;margin-top:2px;}

  .dock-mock{display:flex;gap:8px;padding:12px 16px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;max-width:100%;overflow-x:auto;margin-top:40px;}
  .dock-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dock-icon.highlight{border:2px solid #059669;}

  .verdict{text-align:center;margin-top:48px;padding:24px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;}
  .verdict p{font-size:13px;color:#535353;line-height:1.6;}
</style>
</head>
<body>
<div class="page">

<h1>EcoPilot · 几何 Mark</h1>
<p class="sub">不做解释性 Logo。只做 Dock 栏里一眼能认出的<strong>绿色标记</strong>。</p>

<div class="cards">

  <!-- A -->
  <div class="card">
    <div class="card-visual">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/>
        <rect x="40" y="40" width="100" height="100" rx="20" fill="#fff" opacity="0.92"/>
        <rect x="60" y="60" width="60" height="60" rx="12" fill="#059669"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="name">内框</div>
      <div class="desc">绿底 → 白方 → 绿方。三层嵌套，视觉纵深。像"界面中的界面"——系统感。</div>
      <div class="fav-strip">
        <div class="fav-item"><div style="width:16px;height:16px;border-radius:3px;background:#059669;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 180 180" width="10" height="10"><rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/><rect x="40" y="40" width="100" height="100" rx="20" fill="#fff" opacity="0.92"/><rect x="60" y="60" width="60" height="60" rx="12" fill="#059669"/></svg></div><div class="dim">16</div></div>
        <div class="fav-item"><div style="width:32px;height:32px;border-radius:6px;background:#059669;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 180 180" width="22" height="22"><rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/><rect x="40" y="40" width="100" height="100" rx="20" fill="#fff" opacity="0.92"/><rect x="60" y="60" width="60" height="60" rx="12" fill="#059669"/></svg></div><div class="dim">32</div></div>
      </div>
    </div>
  </div>

  <!-- B -->
  <div class="card">
    <div class="card-visual">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/>
        <circle cx="90" cy="90" r="55" fill="#fff" opacity="0.92"/>
        <circle cx="90" cy="90" r="30" fill="#059669"/>
        <circle cx="90" cy="90" r="12" fill="#fff" opacity="0.9"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="name">同心圆</div>
      <div class="desc">绿底 → 白圆 → 绿圆 → 白点。三圈同心，像雷达/监测/聚焦。识别度极高。</div>
      <div class="fav-strip">
        <div class="fav-item"><div style="width:16px;height:16px;border-radius:3px;background:#059669;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 180 180" width="10" height="10"><rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/><circle cx="90" cy="90" r="55" fill="#fff" opacity="0.92"/><circle cx="90" cy="90" r="30" fill="#059669"/><circle cx="90" cy="90" r="12" fill="#fff" opacity="0.9"/></svg></div><div class="dim">16</div></div>
        <div class="fav-item"><div style="width:32px;height:32px;border-radius:6px;background:#059669;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 180 180" width="22" height="22"><rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/><circle cx="90" cy="90" r="55" fill="#fff" opacity="0.92"/><circle cx="90" cy="90" r="30" fill="#059669"/><circle cx="90" cy="90" r="12" fill="#fff" opacity="0.9"/></svg></div><div class="dim">32</div></div>
      </div>
    </div>
  </div>

  <!-- C -->
  <div class="card">
    <div class="card-visual">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/>
        <circle cx="90" cy="90" r="55" fill="#fff" opacity="0.92"/>
        <rect x="65" y="65" width="50" height="50" rx="10" fill="#059669"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="name">方中圆</div>
      <div class="desc">绿底 → 白圆 → 绿方块。方和圆的对比——"规范与循环"。两种几何的张力。</div>
      <div class="fav-strip">
        <div class="fav-item"><div style="width:16px;height:16px;border-radius:3px;background:#059669;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 180 180" width="10" height="10"><rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/><circle cx="90" cy="90" r="55" fill="#fff" opacity="0.92"/><rect x="65" y="65" width="50" height="50" rx="10" fill="#059669"/></svg></div><div class="dim">16</div></div>
        <div class="fav-item"><div style="width:32px;height:32px;border-radius:6px;background:#059669;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 180 180" width="22" height="22"><rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/><circle cx="90" cy="90" r="55" fill="#fff" opacity="0.92"/><rect x="65" y="65" width="50" height="50" rx="10" fill="#059669"/></svg></div><div class="dim">32</div></div>
      </div>
    </div>
  </div>

</div>

<!-- Dock Mock -->
<div class="dock-mock">
  <div class="dock-icon" style="background:#e8eaed;"><svg width="24" height="24"><circle cx="12" cy="12" r="6" fill="#999"/></svg></div>
  <div class="dock-icon" style="background:#e8eaed;"><svg width="24" height="24"><rect x="6" y="6" width="12" height="12" rx="2" fill="#999"/></svg></div>
  <div class="dock-icon highlight" style="background:#059669;">
    <svg width="24" height="24" viewBox="0 0 180 180">
      <rect x="10" y="10" width="160" height="160" rx="36" fill="#059669"/>
      <rect x="40" y="40" width="100" height="100" rx="20" fill="#fff" opacity="0.92"/>
      <rect x="60" y="60" width="60" height="60" rx="12" fill="#059669"/>
    </svg>
  </div>
  <div class="dock-icon" style="background:#e8eaed;"><svg width="24" height="24"><path d="M12 4 L20 20 L4 20 Z" fill="#999"/></svg></div>
  <div class="dock-icon" style="background:#e8eaed;"><svg width="24" height="24"><circle cx="12" cy="12" r="8" fill="none" stroke="#999" stroke-width="1.5"/><line x1="12" y1="12" x2="12" y2="6" stroke="#999" stroke-width="1.5"/></svg></div>
</div>
<div style="font-size:11px;color:#909090;text-align:center;margin-top:8px;">Dock 栏模拟 · 带绿色高亮的为 EcoPilot</div>

<div class="verdict">
  <p>
    三个方案都不带"含义"，就是纯粹的几何形状。<br>
    <strong>识别度</strong>来自形状本身、和翡翠绿的组合。<br><br>
    军哥看看这三个纯几何的方向？
  </p>
</div>

</div>
</body>
</html>

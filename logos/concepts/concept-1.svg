<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <g id="icon">
    <!-- 背景圆 -->
    <circle cx="256" cy="256" r="230" fill="url(#grad1)"/>
    <!-- 字母 E 的抽象形式 — 三条横线 + 竖线 -->
    <g id="e-shape" fill="#ffffff" opacity="0.95">
      <rect x="145" y="160" width="190" height="32" rx="16"/>
      <rect x="145" y="240" width="140" height="32" rx="16"/>
      <rect x="145" y="320" width="190" height="32" rx="16"/>
      <rect x="145" y="160" width="32" height="192" rx="16"/>
    </g>
    <!-- 右下角的绿色环 — 代表"生态循环" -->
    <circle cx="340" cy="360" r="55" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.35"/>
    <circle cx="360" cy="340" r="40" fill="#059669" stroke="none" opacity="0.4"/>
  </g>
</svg>

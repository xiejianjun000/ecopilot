# EcoPilot 生产部署 - Docker Compose
# 启动: docker compose -f deploy/docker-compose.prod.yml up -d
version: "3.8"

services:
  ecopilot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ecopilot:latest
    container_name: ecopilot
    ports:
      - "3000:3000"  # 前端
      - "8002:8002"  # 后端 API (仅 localhost 可访问)
    volumes:
      - ecopilot_home:/home/ecopilot/.ecopilot-home
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      - ECOPILOT_TEXT_MODEL=${ECOPILOT_TEXT_MODEL:-deepseek-chat}
      - ECOPILOT_VISION_MODEL=${ECOPILOT_VISION_MODEL:-moonshot-v1-32k-vision-preview}
      - ECO_CORS_ORIGIN=${ECO_CORS_ORIGIN:-http://localhost:3000}
      - HERMES_BASE_URL=${HERMES_BASE_URL:-http://localhost:20128/v1}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - HERMES_ENABLED=${HERMES_ENABLED:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/api/chat/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  ecopilot_home:
    driver: local

<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 240 240"
    width="240"
    height="240">
    <defs>
        <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ECE8F0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E0EAF5;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="skinGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#FDE8D0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F5C99B;stop-opacity:1" />
        </radialGradient>
        <linearGradient id="hairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3A3A3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2D2D2D;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="clothingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="blueClothGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2D4A7C;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="purpleClothGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#7C2D5F;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9F3D7A;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="tieGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#7C2D5F;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9F3D7A;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="240" height="240" rx="30" ry="30" fill="url(#backgroundGradient)"/>
    <g transform="translate(50, 50)">
        <!-- Neck and Shoulders -->
        <path d="M40,70 Q38,60 60,55 Q82,60 80,70 Q80,80 60,80 Q40,80 40,70Z" fill="#C8C8C8"/>
        <!-- Face -->
        <ellipse cx="60" cy="70" rx="35" ry="35" fill="url(#skinGradient)"/>
        <!-- Ears -->
        <ellipse cx="50" cy="80" rx="5" ry="10" fill="url(#skinGradient)"/>
        <ellipse cx="70" cy="80" rx="5" ry="10" fill="url(#skinGradient)"/>
        <!-- Hair -->
        <path d="M35,50 L60,30 L85,50 Q88,45 90,50 Q95,60 90,70 Q87,75 85,70 L60,90 L35,70 Q30,75 35,70 Q40,60 35,50Z" fill="url(#hairGradient)"/>
        <!-- Eyebrows -->
        <path d="M45,55 Q50,50 70,50 Q75,55 80,55" fill="none" stroke="#000000" stroke-width="2"/>
        <!-- Eyes -->
        <ellipse cx="50" cy="65" rx="5" ry="10" fill="white"/>
        <circle cx="54" cy="65" r="3" fill="black"/>
        <circle cx="54" cy="65" r="1" fill="white"/>
        <ellipse cx="70" cy="65" rx="5" ry="10" fill="white"/>
        <circle cx="66" cy="65" r="3" fill="black"/>
        <circle cx="66" cy="65" r="1" fill="white"/>
        <!-- Nose -->
        <path d="M55,70 Q60,75 65,70" fill="none" stroke="#000000" stroke-width="2"/>
        <!-- Mouth -->
        <path d="M45,80 Q60,85 75,80" fill="none" stroke="#000000" stroke-width="2"/>
        <!-- Clothing -->
        <path d="M40,90 Q38,110 60,115 Q82,110 80,90 Q80,100 60,100 Q40,100 40,90Z" fill="url(#clothingGradient)"/>
        <path d="M60,105 Q55,102 60,95 Q65,102 60,105Z" fill="#14B8A6"/>
        <!-- Glasses (50% chance, based on name strokes) -->
        <!-- Since the name "薛永泰" has 4 strokes (an even number), no glasses are drawn -->
    </g>
</svg>
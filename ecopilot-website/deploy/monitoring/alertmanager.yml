# ═══════════════════════════════════════════════════════════════
# AlertManager 配置 — EcoPilot 告警路由
# ═══════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m

# ── 路由树 ────────────────────────────────────────────
route:
  receiver: 'default'

  routes:
    # P1 Critical: 电话 + 钉钉 + 短信
    - match:
        severity: critical
      receiver: 'ecopilot-critical'
      repeat_interval: 5m

    # P2 Warning: 钉钉 + 企业微信
    - match:
        severity: warning
      receiver: 'ecopilot-warning'
      repeat_interval: 30m

    # P3 Info: 仅钉钉（不重复骚扰）
    - match:
        severity: info
      receiver: 'ecopilot-info'
      repeat_interval: 1h

# ── 接收器 ────────────────────────────────────────────
receivers:
  - name: 'default'
    # 不配置 = 静默（仅日志记录）

  - name: 'ecopilot-info'
    webhook_configs:
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=REPLACE_WITH_DINGTALK_TOKEN'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json
        # 飞书 / 企微同理，替换 url

  - name: 'ecopilot-warning'
    webhook_configs:
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=REPLACE_WITH_DINGTALK_TOKEN'
        send_resolved: true
      - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_WITH_WECOM_KEY'
        send_resolved: true

  - name: 'ecopilot-critical'
    webhook_configs:
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=REPLACE_WITH_DINGTALK_TOKEN'
        send_resolved: true
      - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_WITH_WECOM_KEY'
        send_resolved: true
    # 生产环境建议添加 PagerDuty / 电话告警
    # pagerduty_configs:
    #   - routing_key: 'REPLACE_WITH_PAGERDUTY_KEY'

# ── 抑制规则 ──────────────────────────────────────────
# Critical 已覆盖 Warning，避免重复通知
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

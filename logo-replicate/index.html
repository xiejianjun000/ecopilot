<!DOCTYPE html><html><head><meta charset="UTF-8"><title>EcoPilot Flux</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#111;color:#eee;padding:40px}
h1{font-size:24px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#888;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#1a1a1a;border-radius:14px;border:1px solid #333;overflow:hidden}
.card-img{display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;min-height:280px}
.card-img img{max-width:100%;max-height:260px;object-fit:contain;border-radius:8px}
.card-body{padding:14px 18px 18px;border-top:1px solid #333}
.card-body .id{font-size:10px;color:#059669;font-weight:600}
.card-body .name{font-size:14px;font-weight:600;margin:2px 0}
</style></head><body>
<h1>EcoPilot · Flux Logo</h1>
<p class="sub">8 concepts · Flux Dev · emerald green</p>
<div class="grid">
<div class="card">
  <div class="card-img"><img src="ec-monogram.png" alt="ec-monogram"></div>
  <div class="card-body">
    <div class="id">ec-monogram</div>
    <div class="name">EC 连笔字母</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="eco-stacked.png" alt="eco-stacked"></div>
  <div class="card-body">
    <div class="id">eco-stacked</div>
    <div class="name">ECO 三模块</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="angular-e.png" alt="angular-e"></div>
  <div class="card-body">
    <div class="id">angular-e</div>
    <div class="name">锐角切割 E</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="flowing-eco.png" alt="flowing-eco"></div>
  <div class="card-body">
    <div class="id">flowing-eco</div>
    <div class="name">流动线条 ECO</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="negative-e.png" alt="negative-e"></div>
  <div class="card-body">
    <div class="id">negative-e</div>
    <div class="name">负空间 E</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="eco-rings.png" alt="eco-rings"></div>
  <div class="card-body">
    <div class="id">eco-rings</div>
    <div class="name">ECO 三环</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="e-arrow.png" alt="e-arrow"></div>
  <div class="card-body">
    <div class="id">e-arrow</div>
    <div class="name">E 箭头</div>
  </div>
</div>
<div class="card">
  <div class="card-img"><img src="eco-triangle.png" alt="eco-triangle"></div>
  <div class="card-body">
    <div class="id">eco-triangle</div>
    <div class="name">ECO 三角</div>
  </div>
</div></div></body></html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════
  # 前端：TypeScript 类型检查 + Lint + 单元测试
  # ═══════════════════════════════════════════════════════
  frontend:
    name: Frontend (tsc + lint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit


      - name: Unit tests (vitest)
        run: pnpm exec vitest run

  # ═══════════════════════════════════════════════════════
  # 后端：Python 导入检查 + 单元测试
  # ═══════════════════════════════════════════════════════
  backend:
    name: Backend (import check + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx python-multipart

      - name: Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Module import check
        run: |
          python -c "import knowledge_api; print('knowledge_api OK')"
          python -c "import permit_parser; print('permit_parser OK')"
          python -c "import license_manager; print('license_manager OK')"

      - name: Unit tests (pytest)
        env:
          OPENAI_API_KEY: sk-test-placeholder
          DEEPSEEK_API_KEY: sk-test-placeholder
          KIMI_API_KEY: sk-test-placeholder
        run: python -m pytest tests/ -v

                        - paragraph [ref=e5386]: 湖南省属于重点地区，烧结机头大概率要求执行表3特别限值（颗粒物20/SO₂ 50/NOx 100），甚至超低排放目标（10/35/50）。实际执行档位以排污许可证上烧结机头标注为准，证上数值才是执法依据，超低排放目标关联差别化电价等利益。

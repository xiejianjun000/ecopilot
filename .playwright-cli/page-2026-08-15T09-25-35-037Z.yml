                        - generic "审计溯源" [ref=e3871]:
                          - img [ref=e3872]
                          - generic [ref=e3876]: "2"
                    - generic [ref=e3877] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3878]: GB 12348-2008按厂界外声环境功能区类别规定限值：0类昼间50/夜间40dB，1类昼间55/夜间45dB，2类昼间60/夜间50dB，3类（工业区）昼间65/夜间55dB，4类（交通干线）昼间70/夜间55dB。钢铁企业若位于工业园区（3类区），适用昼间65/夜间55dB；若靠近居民区（1/2类），限值更严。
                        - generic [ref=e3879]:
                          - button "编辑记忆" [ref=e3880]:
                            - img [ref=e3881]
                          - button "删除记忆" [ref=e3884]:
                            - img [ref=e3885]
                      - generic:

                    - generic [ref=e5240] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5241]: 烧结机头等主要排口必须安装CEMS（烟气在线监测系统），主要废水排口需安装废水在线监测。CEMS联网为强制要求，若SSO修复未完成，需优先恢复烧结机头在线监测，以摸清实际排放情况，为后续治理设备配置提供依据。

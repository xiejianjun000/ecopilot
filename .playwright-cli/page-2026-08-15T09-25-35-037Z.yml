                        - paragraph [ref=e7177]: 危废台账是执法检查的高压线，记录必须规范、可追溯、能闭环。风险点包括：危废管理计划缺失（台账失去源头依据）、记录表与汇总表不衔接、转移联单号缺失、数量单位不一致、贮存位置不具体、经手人未签字等。建议优先补充危废管理计划和规范台账格式，确保执法检查时立得住。

                    - generic [ref=e4241] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4242]: 环境信息公开的核心法定渠道为全国排污许可管理信息平台，用于公开排污信息、自行监测数据及执行报告；企业信用信息公示系统和地方政府生态环境部门平台为关联渠道。企业网站和年度环保报告为主动补充渠道，但指定平台是必须公布，企业网站是主动补充。

                      - generic:
                        - paragraph [ref=e4441]: 重新申请适用于新建、改扩建、许可事项重大变化，原证废止并全流程重新核发；变更适用于排放口、标准、排放量等条款调整，原证有效仅修改部分内容。核心判断标准：是否整体重来（新建/扩建→重新申请）、是否局部修改（已有证条款变→变更）、是否涉及环评新改扩（涉及→先环评，往往重新申请）。

                      - generic:
                        - paragraph [ref=e9332]: 完成超低排放改造可享受差别化电价、环保税减免、环保绩效A级评定（减免重污染天气应急停限产）、排污指标及要素市场倾斜等政策红利。未达标不仅面临罚款，更影响经营竞争力。

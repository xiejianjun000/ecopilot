                    - generic [ref=e5221] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5222]: 钢铁企业各工序治理设备配置：烧结机头需电除尘/袋式除尘+脱硫（+脱硝）+二噁英吸附；烧结机尾、高炉出铁场、转炉二次烟气用袋式除尘；热风炉需除尘+脱硫/脱硝；焦化需VOCs收集治理（洗涤/活性炭/燃烧）；无组织排放需料场封闭、密闭输送、车间集气。废水需中和、絮凝沉淀、生化/深度处理；固废需危废贮存设施（三防）、一般固废贮存区。

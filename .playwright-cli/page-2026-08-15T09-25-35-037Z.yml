                    - generic [ref=e5300] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5301]: 超标后应立即分级响应：核实数据、查找根源、设施故障时主动限产停产，避免连续超标。依法向主管部门主动如实报告超标情况、原因及应对措施，主动报告是从轻处罚情节。整改过程需留证据（故障记录、维修记录、监测数据）以证明非主观故意。掩盖超标、停报数据、拖延整改会升级为数据造假，触发按日计罚、双罚、停产甚至刑责。

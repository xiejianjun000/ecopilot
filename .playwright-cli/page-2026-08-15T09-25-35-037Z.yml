                      - generic:
                        - paragraph [ref=e4384]: 排污权交易方式包括：减排富余量出售、新改扩建项目购买指标、通过政府或平台撮合交易。交易对企业是正向机会，可实现资产变现、保障项目落地，并与碳市场协同形成双重市场杠杆。

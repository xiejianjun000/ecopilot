                    - generic [ref=e9388] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e9389]: 焦化VOCs达标判断需全链条核查：1.有组织排放达标（焦炉烟囱、化产排口VOCs、苯、BaP浓度低于GB 26652或排污许可证限值）；2.无组织逸散控制（装煤、推焦、罐区、装车密闭收集情况）；3.治理设施正常运行（活性炭吸附、洗涤塔、燃烧装置运行及维护记录，否则可能被认定为不正常使用设施）；4.监测数据真实性（在线和手工监测数据完整可追溯）。

                    - generic [ref=e5180] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5181]: 高成本项包括：双碱法NaOH/石灰连续药剂消耗（脱硫效率越高用量越大）、SCR催化剂（钢铁工况损耗快，单片价格高）、脱硫废水处理（含盐废水+零排放成本高）、滤袋/备件（含尘高磨损快，更换频繁）。

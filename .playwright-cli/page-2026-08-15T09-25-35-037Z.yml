                      - generic:
                        - paragraph [ref=e7038]: 依据《危险废物转移管理办法》，跨省或省内转移危险废物均须依法填写并运行电子转移联单，通过全国固体废物管理信息系统操作。联单从危废移出贮存设施、交给运输方或接收方时启用，是危废全流程可追溯的法定凭证。

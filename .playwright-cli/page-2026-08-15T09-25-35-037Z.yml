                    - generic [ref=e5461] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5462]: 烧结机头被要求强制自动监测（CEMS），监测项目为颗粒物、SO₂、NOx。这是钢铁超低排放的核心战场，因需同时控制SO₂（脱硫）、NOx（脱硝）、颗粒物（除尘）和二噁英（钢铁特有严控项）。二噁英需按频次手工监测，不可忽略。

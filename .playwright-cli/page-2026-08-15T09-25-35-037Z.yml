                        - paragraph [ref=e6902]: 续签危废处置合同时，必须索取并核对接收方《危险废物经营许可证》复印件，确认许可证在有效期内、核准经营类别和代码覆盖自身危废种类、处置能力可承接危废量和种类。跨省转移还需接收地省级生态环境部门同意。只签合同不核资质会导致联单、台账闭环断裂。

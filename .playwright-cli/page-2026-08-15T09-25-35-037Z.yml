                    - generic [ref=e4086] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4087]: 焦化、危废贮存区属于高风险区域，建议加密排查频次，不应死守3年。企业需先确认是否属于土壤重点监管单位，以判断是否负有强制排查义务。排查报告、整改记录、监测数据等均须存档备查。

                        - paragraph [ref=e7117]: 常见错误包括：联单数量与台账不符、代码填错或成分不清、运输或接收方信息不全且无资质、纸质联单不归档或电子联单不确认。委托的运输单位和接收单位必须持有危废经营或运输资质，且接收地省级生态环境部门须同意接收，否则转移行为违法。

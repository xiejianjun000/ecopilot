                    - generic [ref=e4301] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4302]: 环境信息公开是企业的法定义务，依据《排污许可条例》和《生态环境法典》强化要求。重点排污单位按名录强制公开。公开内容涵盖排污许可证信息（证号、许可排放量/浓度）、污染物实际排放数据、自行监测数据、执行报告、超标情况及整改措施、治污设施运行状态。核心要求是数据真实、四者一致（台账、监测、执行报告、公开数据闭环）、按时更新。

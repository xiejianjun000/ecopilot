                    - generic [ref=e3817] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3818]: 厂界噪声监测参照GB 12348-2008和HJ 706执行。每个测点适用限值按厂界外声环境功能区类别确定：3类工业区昼间65dB(A)、夜间55dB(A)，1/2类功能区限值更严格。监测数据需存档，超标点位需标记并分析对应噪声源原因。
                        - generic [ref=e3819]:
                          - button "编辑记忆" [ref=e3820]:
                            - img [ref=e3821]
                          - button "删除记忆" [ref=e3824]:

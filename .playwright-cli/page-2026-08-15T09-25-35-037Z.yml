                        - paragraph [ref=e4498]: 变更材料准备需注意：涉及新改扩的必须先完成环评；材料内容须与证上信息及实际排放一致；变更项不可遗漏。常见风险包括：材料与实际情况不符导致审批受阻或证实不符；未先办环评导致变更无法落地；变更项遗漏导致后续违规。

                        - paragraph [ref=e7196]: 执行报告与台账数据不一致属于证据链断裂信号，需先判断性质：报告抄录错误、核算口径不同、台账失真或实际超标漏报。处理步骤为锁定源头、以真实监测数据为准、主动更正并附说明、四者同步（监测、台账、报告、公开信息）。严禁直接改台账凑报告或掩盖超标，否则构成数据造假。

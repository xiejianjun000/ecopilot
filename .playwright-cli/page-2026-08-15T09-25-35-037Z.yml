                      - generic:
                        - paragraph [ref=e5323]: 连续超标性质比偶发严重得多，会触发按日计罚和双罚（处罚企业+处罚责任人）。掩盖超标行为比超标本身后果更严重，可能从超标升级为数据造假，涉嫌刑事责任。拖延不整改导致超标持续，同样面临按日计罚、双罚和停产处罚。

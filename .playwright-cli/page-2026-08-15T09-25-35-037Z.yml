                        - generic "审计溯源" [ref=e3909]:
                          - img [ref=e3910]
                          - generic [ref=e3914]: "3"
                    - generic [ref=e3915] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3916]: 钢铁企业主要噪声源包括：高炉放散、风机（采用消声器、隔声措施）、轧机、空压机（采用隔声罩、减振措施）、除尘风机（采用消声、隔声措施）。这些是降噪和合规管理的重点对象。
                        - generic [ref=e3917]:
                          - button "编辑记忆" [ref=e3918]:
                            - img [ref=e3919]
                          - button "删除记忆" [ref=e3922]:

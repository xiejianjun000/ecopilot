                        - paragraph [ref=e9471]: 转炉二次烟气采用袋式除尘器，超低排放要求颗粒物10 mg/m³，覆盖点位包括兑铁水、加料口、出钢口、精炼工位等逸散点。需建完善集气罩和捕集系统，确保车间无可见烟粉尘外逸，转炉车间整体需密闭/半密闭。二次烟气温度较高、粉尘含铁，需选耐高温滤料（如PPS、PTFE）并配套温度控制。

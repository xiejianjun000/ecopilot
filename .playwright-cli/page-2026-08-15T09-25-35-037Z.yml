                      - generic:
                        - paragraph [ref=e4365]: 企业参与排污权交易需满足三个前提：已有排污权（初始分配或购买）、减排后产生富余指标、纳入政府排污权交易体系。有富余指标可出售，指标不足需购买，未纳入体系或指标不明需先核实登记情况。

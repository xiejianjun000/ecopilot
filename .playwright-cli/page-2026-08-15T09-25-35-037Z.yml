                      - generic:
                        - paragraph [ref=e9256]: 建议企业按三步自查：1）优先修复SSO接口（P0级），联系娄底市生态环境局信息中心恢复联网；2）恢复后核对烧结机头、炼铁、转炉等排口在线数据是否连续、有无恒值或缺失；3）比对在线数据、手工监测、运行台账、执行报告四项是否闭环一致。

                      - generic:
                        - paragraph [ref=e9313]: 烧结机头是钢铁超低排放核心关注点，限值为颗粒物10mg/m³、SO₂ 35mg/m³、NOx 50mg/m³，远严于国标。高炉出铁场、热风炉颗粒物10mg/m³、SO₂ 50mg/m³；转炉二次除尘颗粒物10mg/m³。
                        - generic [ref=e9314]:

                      - generic:
                        - paragraph [ref=e5503]: 环保信用评价一般分为A（诚信）、B（一般）、C（较差）、D（差）、E（失信/黑名单）五级。评级结果公开，直接影响企业信贷、招投标和监管检查频次：A级享减少检查、绿色通道；C/D级提高检查频次、重点监管；E级纳入黑名单并联合惩戒。处罚记录是最大扣分项，一次违法处罚即拉低信用等级并公示。

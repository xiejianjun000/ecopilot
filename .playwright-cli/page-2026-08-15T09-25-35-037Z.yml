                    - generic [ref=e4067] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4068]: 土壤污染隐患排查频次以风险评估结果为导向，非一刀切每3年。高风险区域（如焦化区、危废贮存区、涉重金属区域）应加密排查，低风险区域可保持每3年基线。配套监测中，重点区域地下水监测井常按半年至1年频次开展。
                        - generic [ref=e4069]:
                          - button "编辑记忆" [ref=e4070]:

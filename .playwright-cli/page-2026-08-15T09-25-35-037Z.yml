                        - paragraph [ref=e7000]: 危废贮存设施须满足防渗漏、防流失、防扬散三防要求：防渗漏靠基础防渗+渗滤液收集处置；防流失靠围堰、导流沟；防扬散靠密闭/顶棚。不同类别危废须分区存放，互不相容的隔离，设置警示标志，易燃反应性危废独立存放并保持防火间距，必要时设通风防爆设施。

                      - generic:
                        - paragraph [ref=e4931]: 环保验收材料分为四类：基础合规类（环评批复、环保验收文件、排污许可证）、工程设备类（竣工资料、设备清单、调试记录）、监测数据类（超低排放评估监测报告、CEMS联网验收报告、自行监测数据）、管理台账类（环境管理台账、应急预案、危废管理计划、信息公开记录）。企业缺失环评批复、环保验收、应急预案、危废计划，且在线监测SSO故障，是验收主要短板。

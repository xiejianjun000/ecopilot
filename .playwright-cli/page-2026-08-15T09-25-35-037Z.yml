                    - generic [ref=e9274] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e9275]: 根据环大气〔2019〕35号文件，钢铁行业超低排放改造总体时间节点为：2020年底重点区域力争60%产能完成改造；2025年底重点区域基本完成，全国力争80%以上产能改造。当前（2026年）集中达标窗口已过，企业需确认是否完成改造及公示情况。
                        - generic [ref=e9276]:

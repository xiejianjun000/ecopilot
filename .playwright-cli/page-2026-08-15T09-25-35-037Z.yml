                        - paragraph [ref=e4751]: 环境应急预案备案流程为：预案编制→专家评审→向所在地生态环境主管部门备案→定期修订重新备案。新编预案编制完成后按规定及时备案；修订后须在20个工作日内重新备案。未按规定编制或备案预案的，责令整改并可处罚款；无预案发生突发环境事件，应急处置无据，责任更重。

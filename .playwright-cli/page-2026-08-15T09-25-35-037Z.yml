                        - generic "审计溯源" [ref=e3890]:
                          - img [ref=e3891]
                          - generic [ref=e3895]: "5"
                    - generic [ref=e3896] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3897]: 钢铁企业噪声排放限值确定的关键：一是看厂界外声环境功能区类别，由环评或规划确定；二是以环评批复或许可证载明的噪声限值为执法依据；三是钢铁企业高噪源多，高炉放散、风机、轧机等需重点降噪。
                        - generic [ref=e3898]:
                          - button "编辑记忆" [ref=e3899]:
                            - img [ref=e3900]
                          - button "删除记忆" [ref=e3903]:
                            - img [ref=e3904]

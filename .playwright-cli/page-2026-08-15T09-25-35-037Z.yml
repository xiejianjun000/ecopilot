                    - generic [ref=e4048] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4049]: 发生土壤/地下水污染事故或泄漏、新增重点区域或设施、生产工艺重大变化、周边环境敏感目标变化时，须立即开展土壤污染隐患排查。这些触发情形不限于固定周期，需及时响应。
                        - generic [ref=e4050]:
                          - button "编辑记忆" [ref=e4051]:
                            - img [ref=e4052]
                          - button "删除记忆" [ref=e4055]:

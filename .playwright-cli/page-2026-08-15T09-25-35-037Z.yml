                      - generic:
                        - paragraph [ref=e5282]: 用户企业烧结机已有双碱法脱硫（脱SO₂），但需评估是否补脱硝（NOx）以及颗粒物/二噁英治理是否足够，这取决于实际排放数据。需先修复SSO（在线监测）以获取真实排放情况，再决定是否提标改造。

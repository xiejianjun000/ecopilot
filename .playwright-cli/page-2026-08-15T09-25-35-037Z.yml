                        - paragraph [ref=e4969]: 超低排放改造验收流程为：工程验收→系统试运行及性能测试→CEMS联网验收比对（HJ 75/76）→委托有资质单位开展超低排放评估监测（有组织、无组织、清洁运输）→形成评估报告并公示→排污许可变更（若涉及排放口/标准变化）→环保竣工验收（若属建设项目）→排污口规范化更新标识→文件归档。关键判定项包括有组织排放达超低限值、无组织排放料场密闭无可见外逸、清洁运输比例达标、在线监测联网比对合格。

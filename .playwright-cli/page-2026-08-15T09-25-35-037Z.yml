                        - generic "审计溯源" [ref=e3947]:
                          - img [ref=e3948]
                          - generic [ref=e3952]: "2"
                    - generic [ref=e3953] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3954]: 地下水监测井布设需遵循上下游兼顾原则，设置背景井（上游）、污染监视井（下游/侧向）和扩散监控井（场地边界）。重点覆盖危废贮存区、焦化区、废水处理区、储罐区等区域，反映地下水流向和主要风险源。
                        - generic [ref=e3955]:
                          - button "编辑记忆" [ref=e3956]:
                            - img [ref=e3957]
                          - button "删除记忆" [ref=e3960]:

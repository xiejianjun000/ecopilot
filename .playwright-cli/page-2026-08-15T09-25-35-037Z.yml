                        - paragraph [ref=e7095]: 联单必须与危废台账完全对应：台账转移栏的联单号与实际联单号一致，台账转移量与联单数量一致，转移时间与联单时间一致。三者对不上即视为危废管理闭环断裂，属于执法检查中的高风险问题，可能引发行政处罚。

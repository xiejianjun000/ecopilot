                      - generic:
                        - paragraph [ref=e5367]: 烧结机/球团焙烧设备排放限值分三层：表2（新建企业）颗粒物50、SO₂ 200、NOx 300、氟化物4.0、二噁英0.5 ng-TEQ/m³；表3（特别限值）颗粒物20、SO₂ 50、NOx 100、氟化物4.0、二噁英0.5 ng-TEQ/m³；超低排放颗粒物约10、SO₂ 35、NOx 50。依据GB 28662-2012及2017修改单。

                    - generic [ref=e4162] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4163]: 钢铁企业涉重金属，若属重点监管单位，土壤排查是法定义务。焦化区、危废贮存区为高土壤污染风险区，应重点排查。排查报告、整改记录需与档案、台账联动，确保合规留痕。
                        - generic [ref=e4164]:

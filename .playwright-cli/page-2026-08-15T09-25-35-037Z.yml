                        - paragraph [ref=e4792]: 贵司档案中应急预案疑似缺失（8项必备档案之一），属合规缺口。根据《生态环境法典》，应急预案是企业法定义务，缺失本身即违规。若涉及危化品或高风险工序，备案和演练要求更严。建议将应急预案编制→备案→演练→修订作为年度合规必办项，尽快启动。

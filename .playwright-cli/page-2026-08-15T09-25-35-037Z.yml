                        - paragraph [ref=e6962]: 危险废物贮存场所建设须符合GB 18597-2023《危险废物贮存污染控制标准》。选址须避开生态保护红线、基本农田、饮用水源保护区、地质灾害易发区，并满足环评及批复要求，与居民区保持安全防护距离。建设完成后须验收合格方可投入使用。

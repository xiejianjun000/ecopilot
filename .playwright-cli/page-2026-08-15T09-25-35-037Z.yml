                    - generic [ref=e9369] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e9370]: 焦化是钢铁全流程中VOCs和异味最集中、监管最严的环节，主要产生环节包括：炼焦装煤、推焦（苯、苯系物、多环芳烃、BaP）；化产回收（鼓冷、脱硫、脱苯，产生VOCs、NH₃、苯系物）；焦炉煤气净化储存（苯、甲苯、二甲苯等）；苯类储罐、装车（苯、BTEX逸散）。

                    - generic [ref=e4282] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4283]: 环境信息公开的关键难点在于数据真实性与平台联动。SSO接口故障会导致监测数据不全，公开内容难以完整；执行报告待核会导致公开信息与报告不一致。公开的前提是数据真实、能对得上，在线监测数据要通畅、执行报告要按时提交。

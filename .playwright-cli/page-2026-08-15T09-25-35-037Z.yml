                        - paragraph [ref=e9408]: 要准确判断焦化VOCs是否达标，需获取两块核心数据：1.焦化工序各排口的实际VOCs监测数据（有组织排放浓度）；2.无组织逸散现场管控情况（密闭收集、泄漏检测等）。缺少这些数据无法直接判定达标或超标。

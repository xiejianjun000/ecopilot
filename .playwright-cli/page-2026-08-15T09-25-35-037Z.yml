                    - generic [ref=e9293] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e9294]: 超低排放考核涵盖有组织排放（各工序颗粒物、SO₂、NOx达超低限值）、无组织排放（料场密闭、输送密闭、车间无可见烟粉尘外逸）、清洁运输（大宗物料清洁运输比例达标），是全流程、全环节要求，而非仅排口达标。
                        - generic [ref=e9295]:

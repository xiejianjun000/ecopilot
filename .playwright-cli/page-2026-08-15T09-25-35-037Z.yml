                        - paragraph [ref=e4732]: 钢铁企业（含焦化、危化品）应急管理体系应遵循：先编制应急预案并备案，再按频次开展演练（半年/每年），演练后10个工作日内报送报告，根据演练发现修订预案，形成闭环管理。预案缺失时无法谈演练。

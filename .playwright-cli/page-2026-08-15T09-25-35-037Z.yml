                        - paragraph [ref=e5604]: 申请超低排放改造相关补贴和优惠政策的前提条件包括：通过超低排放改造评估监测并完成公示；在线监测数据真实、达标；环保绩效评级达标。其中在线监测数据完整性是关键硬性障碍，若存在SSO接口故障导致数据不完整，将直接影响差别化电价、环保绩效A级等优惠的申请资格。

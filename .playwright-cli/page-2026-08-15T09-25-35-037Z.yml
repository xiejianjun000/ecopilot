                      - generic:
                        - paragraph [ref=e7139]: 依据《危险废物管理计划和管理台账制定技术导则》（HJ 1259-2022），危废台账包含记录表（产生/贮存/转移）和汇总表（月/年）两类。记录表必填内容包括危废名称、类别、代码、数量、产生部门/工艺、时间、贮存位置、转移联单号、运输信息等。关键要素：危废类别+代码必须准确（如废矿物油HW08 900-214-08），数量单位统一（kg或t），贮存位置对应具体库/容器，转移联单号与电子联单对应，经手人签字明确责任。台账需与危废管理计划、转移联单、贮存设施台账形成'三账'闭环，数量进-出-存对平。

                    - generic [ref=e5524] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5525]: 评价围绕五个维度打分：行政许可（排污许可、环评执行）、污染物排放（达标、总量、在线数据）、环境执法（违法行为、处罚记录，权重最重）、环境责任（应急预案、台账、保证金、修复义务）、社会责任（信访、举报、信息公开）。企业应确保在线监测数据正常、危废档案完整、碳账户注册，避免因合规能力不足被扣分。

                    - generic [ref=e3798] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3799]: 厂界噪声监测点应沿厂界均匀布设，重点声源区加密，避开非厂界干扰源。测点设在厂界外1m、高度1.2m处，敏感点（如居民区）侧需补充布点。昼间和夜间分别监测，工况需正常，排除偶发噪声，并记录点位坐标、位置及对应声源。
                        - generic [ref=e3800]:
                          - button "编辑记忆" [ref=e3801]:
                            - img [ref=e3802]
                          - button "删除记忆" [ref=e3805]:

                    - generic [ref=e5161] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5162]: 治理设备运行成本主要由药剂/材料（40%-60%）、能耗（20%-30%）、人工运维（10%-20%）、维修/备件（10%-20%）构成。其中药剂和材料是最大头，尤其是双碱法脱硫的NaOH、石灰连续消耗，SCR催化剂2-3年更换一次且价格高，脱硫废水处理成本也不低。

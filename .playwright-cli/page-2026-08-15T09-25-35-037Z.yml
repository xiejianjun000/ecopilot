                    - generic [ref=e4181] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4182]: 环境信息公开不及时属于多项合规的联动扣分项，直接后果包括责令改正和罚款；隐性后果包括环保信用评价降分、监测台账报告证据链断裂、被专项核查风险上升、影响A级企业评级及电价优惠等政策红利；同时依据《生态环境法典》，相关责任人可能被同步追责（双罚），安环负责人个人风险上升。
                        - generic [ref=e4183]:
                          - button "编辑记忆" [ref=e4184]:
                            - img [ref=e4185]
                          - button "删除记忆" [ref=e4188]:
                            - img [ref=e4189]

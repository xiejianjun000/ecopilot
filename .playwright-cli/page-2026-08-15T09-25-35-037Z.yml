                    - generic [ref=e5442] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5443]: 烧结机排放主要污染物包括：颗粒物（烟尘、粉尘）、SO₂、NOx、二噁英类（钢铁特色严控项）、CO、氟化物、重金属（铅、汞等）。其中颗粒物、SO₂、NOx、二噁英为四大核心污染物，是超低排放和在线监测的重点。此外还有湿法脱硫废水（高盐、SS、重金属）及烧结粉尘、脱硫石膏、除尘灰等固废。

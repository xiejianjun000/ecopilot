                      - generic:
                        - paragraph [ref=e4814]: 依据《突发环境事件应急预案管理办法》和《生态环境法典》，出现以下情形应当及时修订预案：公司、工艺或设施发生重大变化（如超低排放改造）；原料、产品改变影响环境风险（如新增危化品）；周边环境敏感目标变化（居民区、水源地等）；应急组织、负责人变化；应急资源或物资改变；演练发现重大缺陷。

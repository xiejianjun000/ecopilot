                    - generic [ref=e7075] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e7076]: 最容易出错的环节包括：危废代码必须与台账一致且准确，不能笼统填写；转移量必须与实际称量一致，不得填写预估数；移出、运输、接收三方均须确认签字或签章；联单号须在台账和转移记录中登记以便追溯。任何环节缺失或错误均构成管理缺陷。

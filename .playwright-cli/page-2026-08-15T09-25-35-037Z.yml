                        - paragraph [ref=e4871]: 冷水江钢铁2026年度环保工作计划以修复在线监测、补齐合规缺项（碳账户、危废、8项档案）、打通证据闭环、推进超低排放改造、争取环保绩效A级为目标。Q1头等大事为修复SSO接口恢复在线监测、注册碳市场账户、补编危废管理计划；Q2完成档案补全和超低排放改造方案；Q3实施改造并确保监测正常运行；Q4验收评估并申请A级绩效。

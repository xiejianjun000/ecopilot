                    - generic [ref=e5259] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5260]: 治理设备配置优先级：1. 修复CEMS联网（SSO修复）恢复在线监测；2. 危废贮存设施合规（三防+分区+标识）；3. 超低排放达标核查（视实际排放决定是否补脱硝等）。正确逻辑：先修在线监测→摸清实际排放→对照超标项→缺什么补什么，避免盲目上设备。

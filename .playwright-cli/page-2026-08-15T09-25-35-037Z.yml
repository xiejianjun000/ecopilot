                    - generic [ref=e4105] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4106]: 涉重金属、化工类企业（如钢铁企业）属于土壤重点监管单位的，必须开展土壤污染隐患排查。是否属于重点监管单位需先进名录核实，涉及焦化/化产、危废贮存区域的企业应重点关注。

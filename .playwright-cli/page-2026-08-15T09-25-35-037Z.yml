                    - generic [ref=e4143] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4144]: 技术要点包括：危废库、焦化区防渗层完好性检查；管道、储罐渗漏点识别；重点区域设监测井定期采样土壤/地下水；评估历史污染状况。发现隐患需及时整改，建立隐患排查整改台账，定期复查并保存报告。
                        - generic [ref=e4145]:
                          - button "编辑记忆" [ref=e4146]:
                            - img [ref=e4147]
                          - button "删除记忆" [ref=e4150]:

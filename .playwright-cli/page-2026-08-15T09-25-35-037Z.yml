                          - img [ref=e4195]
                          - generic [ref=e4199]: "4"
                    - generic [ref=e4200] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4201]: 环境信息公开中，'未及时公开'属于义务履行滞后（违法），而'公开内容不实'涉嫌造假（性质更重）。核心原则是宁可如实公开晚一点，绝不虚假公开。公开内容必须与监测数据、执行报告、台账保持一致，避免出现'公开一套、报告一套'的情况。
                        - generic [ref=e4202]:
                          - button "编辑记忆" [ref=e4203]:
                            - img [ref=e4204]
                          - button "删除记忆" [ref=e4207]:

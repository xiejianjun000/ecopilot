                        - paragraph [ref=e5585]: 超低排放改造补贴政策依据环大气〔2019〕35号文件，主要包括：中央大气污染防治资金、地方财政补贴、技改专项资金等直接资金支持；差别化电价、环保税减免、用水排污倾斜等长期价格政策；绿色信贷、绿色债券、碳资产收益等金融支持；以及环保绩效A级评定带来的重污染天气免停限产、排污指标倾斜、执法差异化等监管红利。

                    - generic [ref=e3972] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3973]: 监测井建设须参照HJ 164规范进行建井、护壁、成井，井深和层位需针对目标含水层，明确坐标和标识，并采取防雨水倒灌、防人为破坏等保护措施。
                        - generic [ref=e3974]:
                          - button "编辑记忆" [ref=e3975]:
                            - img [ref=e3976]
                          - button "删除记忆" [ref=e3979]:

                      - generic:
                        - paragraph [ref=e4694]: 规范演练流程：1.制定演练计划（明确类型、情景、时间、人员）；2.演练前准备（宣贯培训、物资、职责分工）；3.实施演练（按预案模拟报警、处置、疏散、报告）；4.演练评估（记录过程、评估处置与预案缺陷）；5.总结整改（更新预案、形成报告）。

                        - paragraph [ref=e5948]: 环保税应纳税额=计税依据×适用税率（定额税率）。大气污染物按污染当量数计，每污染当量1.2-12元；水污染物每污染当量1.4-14元；固体废物按排放量每吨25-1000元；噪声按超标分贝每档350-11200元。计税依据为监测数据核算的实际排放量换算为污染当量数。

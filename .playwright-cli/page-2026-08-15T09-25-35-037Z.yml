                    - generic [ref=e3839] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3840]: 钢铁企业主声源多（高炉放散、风机、轧机等），应对应厂界加密布点；若邻近居民区等敏感点，靠该侧需加强布点。厂界噪声监测应纳入企业自行监测方案，确保合规落实。
                        - generic [ref=e3841]:

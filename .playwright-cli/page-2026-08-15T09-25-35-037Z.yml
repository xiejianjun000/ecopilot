                      - generic:
                        - paragraph [ref=e7057]: 联单必填栏位包括：移出单位名称（含统一社会信用代码）、地址、联系方式；危废名称、类别、代码、主要成分、形态、特性；实际转移量（与台账一致，单位统一）；运输单位、车牌号、运输人；接收方名称、代码、地址；拟接收日期。各栏位均须准确完整填写。

                      - generic:
                        - paragraph [ref=e4460]: 若仅做超低排放提标改造（加脱硫脱硝、治理设施变化），通常走变更程序，因属于证上排放口、治理方式、执行标准调整；若涉及扩建产能、新增排放口形成新污染源，则可能需重新申请。建议改造前向核发部门确认程序，避免走错延误。

                    - generic [ref=e4124] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4125]: 标准流程为：摸清底数→识别重点区域→现场排查（泄漏隐患）→检测评估→形成报告→整改→台账留档。排查内容涵盖设施设备（管道、储罐、池槽防渗）、生产经营场所（危废贮存点、焦化区、废水处理区）、运输贮存及历史遗留污染。
                        - generic [ref=e4126]:
                          - button "编辑记忆" [ref=e4127]:
                            - img [ref=e4128]
                          - button "删除记忆" [ref=e4131]:

                    - generic [ref=e3858] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3859]: 钢铁企业厂界噪声排放主要适用GB 12348-2008《工业企业厂界环境噪声排放标准》，同时需结合《生态环境法典》对噪声污染防治的总要求。该标准是钢铁企业噪声合规的核心依据。
                        - generic [ref=e3860]:
                          - button "编辑记忆" [ref=e3861]:
                            - img [ref=e3862]
                          - button "删除记忆" [ref=e3865]:
                            - img [ref=e3866]
                      - generic:

                      - generic:
                        - paragraph [ref=e9449]: 转炉炼钢除尘需配置两级体系：一次除尘治理转炉吹炼时炉口主烟气（煤气/含尘烟气），采用转炉煤气干法（LT）或湿法（OG）净化回收系统，回收煤气作为能源利用，直接放散既浪费又违法；二次除尘治理兑铁水、加料、出钢、精炼等逸散烟气，采用袋式除尘器，超低排放要求颗粒物10 mg/m³。

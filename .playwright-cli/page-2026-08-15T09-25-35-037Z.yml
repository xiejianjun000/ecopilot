                      - generic:
                        - paragraph [ref=e9351]: 2026年时间点下，超低排放已从'要不要改'转变为'改得怎么样、有没有公示'。企业应尽快确认是否完成超低排放改造，并核对评估监测、公示情况，重点关注烧结机头、高炉出铁场、转炉二次除尘、焦化VOCs无组织收集及清洁运输比例等环节。

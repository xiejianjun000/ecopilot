                    - generic [ref=e3934] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3935]: 钢铁企业厂界噪声需在昼间和夜间分别监测，并与排污许可证对噪声的要求衔接。监测结果用于验证是否满足GB 12348-2008限值及许可证规定。

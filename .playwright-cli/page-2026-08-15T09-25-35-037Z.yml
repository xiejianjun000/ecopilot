                      - generic:
                        - paragraph [ref=e7019]: 钢铁企业危废（废机油、含油废物、焦化脱硫废液等）通常为液态/含油类，建设贮存设施时重点做好防渗、围堰、分类和渗滤液收集。含油废物与容器须防渗漏、防火。同时档案中危废管理计划缺失，建议硬件建设与管理制度同步完善。

                    - generic [ref=e4010] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4011]: 土壤重点监管单位须按规范设置地下水监测井，焦化、危废区为重点设井区域需加密监测。监测井是土壤隐患排查和重点单位监管的配套硬件，须与土壤排查工作同步联动。
                        - generic [ref=e4012]:

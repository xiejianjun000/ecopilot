                      - generic:
                        - paragraph [ref=e4615]: 应急物资储备遵循够用、针对性、可及时调配原则。常见物资分三类：污染物处置类（吸油毡、围油栏、沙土、活性炭）、堵漏检修类（堵漏工具、应急泵、备用管件）、防护类（防毒面具、防护服、报警器、检测仪）。储备管理要求数量核验、位置明确、专人管理、定期换新，且物资配置必须与应急预案和风险分析对应，不能预案写了物资没有。

                      - generic:
                        - paragraph [ref=e9215]: 在线监测数据异常常见信号包括：数据恒值（长期不变，疑似造假或设备故障）、数据缺失（断线未保证正常传输）、频繁超标（治理设施不达标）、异常波动（与工况不符，设备维护不当）、数据与台账不符（证据链断裂）。监管会据此判定企业合规性。

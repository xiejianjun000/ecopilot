                    - generic [ref=e5199] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e5200]: 比运行费更重要的是隐性成本：不达标罚款（一次处罚远高于运行费）、重污染天气未达A级被停限产损失、超低排放不达标拿不到差别化电价优惠、高碳排放需购买碳配额。治理设备运行费是可控日常支出，不达标带来的罚款、停产、失去优惠才是不可控大成本。

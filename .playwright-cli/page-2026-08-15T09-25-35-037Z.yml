                    - generic [ref=e4478] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e4479]: 排污许可证变更需提交：变更申请表、法定代表人身份证明或授权委托书、统一社会信用代码证照、原排污许可证。若因改造或排放变化引起，还需补充环评批复（涉及新改扩）、环保验收材料、工程技术方案/设备清单、排放口信息更新、执行标准依据、监测方案。材料需对应变更理由，信息真实一致。

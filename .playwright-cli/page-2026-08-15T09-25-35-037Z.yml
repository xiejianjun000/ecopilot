                        - generic "审计溯源" [ref=e3985]:
                          - img [ref=e3986]
                          - generic [ref=e3990]: "2"
                    - generic [ref=e3991] [cursor=pointer]:
                      - generic:
                        - paragraph [ref=e3992]: 常规监测指标包括pH、电导率、水位；特征污染物按区域区分，焦化区监测苯系物、氨氮，涉重金属区域监测铅、铬、汞等。监测频次按风险评估确定，通常每半年至一年一次。
                        - generic [ref=e3993]:

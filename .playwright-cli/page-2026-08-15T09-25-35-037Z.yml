                        - paragraph [ref=e5882]: 在线监测数据造假破绽极多，几乎必然暴露。造假环节涉及数据断点、设备运行记录、手工记录、执法比对测试等多个方面，环节越多露馅风险越大。一旦查实，将从重处理。企业应通过查明超标根源、治理设施达标、如实报告整改、优化工艺等合规方式应对监测压力。

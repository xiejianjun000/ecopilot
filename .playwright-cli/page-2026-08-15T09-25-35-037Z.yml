                        - paragraph [ref=e6921]: 危险废物识别标志设置依据HJ 1276-2022《危险废物识别标志设置技术规范》。设置位置包括：贮存设施入口设警告标志、贮存库房外墙设识别标志标签、单个容器/包装贴标签、运输工具设运输警示标志。标识牌必含图形符号（菱形警告图案）、警示语、危废名称、类别代码（如HW08 900-214-08）、危险特性（腐蚀性、毒性、易燃性等）。

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
exclude = ["tests/", ".venv/", "__pycache__/"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
